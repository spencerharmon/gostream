# Zuul CI pipeline for gostream, run on the swarm's self-hosted Zuul (deployed
# into the k3s cluster by the flux submodule's `zuul` task) — NOT GitHub
# Actions. See docs/tasks/zuul-ci.md and docs/tasks/gostream-image-build.md for
# the full rationale, the GitHub-Actions -> Zuul migration, and the real
# publish pipeline this task adds.
#
# PIPELINE FACTS (do not re-derive): the flux `zuul-github-removal` task
# deleted the `check`/`gate` pipelines tenant-wide — the git driver backing
# this tenant has no reporter, so those GitHub-shaped pipelines were dead
# weight once the GitHub connection was ripped out. The ONLY pipeline this
# tenant defines today is `post` (fires on `ref-updated`, i.e. every push to
# the tracked branch). Every job below is therefore attached to `post`, not
# `check`/`gate` — attaching to a pipeline this tenant does not define would be
# a hard config-load error, not harmless unused YAML.
#
# HONEST NODEPOOL GATING (do not "fake green"):
#   * gostream-build-test needs a Linux node with a Go toolchain (>= go.mod's
#     `go 1.24.0`), libfuse3-dev, build-essential and pkg-config — gostream is a
#     cgo binary (github.com/hanwen/go-fuse), so it MUST build CGO_ENABLED=1 and
#     canNOT be the CGO_ENABLED=0 static build the shared Zuul-CI convention
#     assumes for pure-Go components (see docs/tasks/zuul-ci.md).
#   * gostream-image-build-check builds the image locally (no push) to prove it
#     still builds on every change; needs a Linux node with Docker + buildx.
#   * gostream-image-build (below) is the REAL publish job: it inherits flux's
#     `build-and-publish-image` base job and needs the `buildah-pod` Nodepool
#     node that base job's nodeset requests.
# Per ROI (reconciled 332606ef, 2026-07-20) the Nodepool build-node provider
# NOW EXISTS, so these jobs are no longer honestly-gated on its absence. The
# earlier gap noted here (the `build-and-publish-image` base job + the
# `spencerharmon/gostream` untrusted-project registration missing from flux's
# tracked tenant-config.yaml as of flux commit b0690dd) is RESOLVED as of flux
# commit cf78040 (base job + gitea_registry_push secret) and 33df689 (the
# read-only credential-less github git connection registering this project) —
# verified 2026-07-22 (bee-gostream-image-build-verify): the tenant's
# `/api/tenant/beehive/projects` now lists `spencerharmon/gostream` over the
# `github` connection and `/api/tenant/beehive/jobs` lists `gostream-image-build`
# with zero tenant config-errors. This push (bee-gostream-image-build-verify,
# 2026-07-22) also serves as the `post`-pipeline trigger to confirm a real
# `gostream-image-build` run publishes and is pullable by digest.
#
# `nodeset:` is deliberately OMITTED on the two node-needing non-publish jobs
# (each inherits whatever nodeset the tenant's base job defines); the publish
# job inherits its nodeset (`buildah-pod`) from its `build-and-publish-image`
# parent.

- job:
    name: gostream-build-test
    description: >
      gofmt / go vet / go build / go test for gostream — the non-image half of
      CI. gostream links FUSE via cgo, so build and test run CGO_ENABLED=1
      (the CGO_ENABLED=0 static-binary convention does not apply here). The node
      must provide the Go toolchain plus libfuse3-dev, build-essential and
      pkg-config.
    run: playbooks/gostream-build-test.yaml
    timeout: 1800

- job:
    name: gostream-image-build-check
    description: >
      Builds the gostream container image from docker/Dockerfile (the same
      multi-stage, CGO_ENABLED=1 build the retired GitHub Actions
      docker-publish workflow used) for the node's native architecture with
      `docker buildx --load`, proving the image builds on every change — a
      local, no-push sanity check. The REAL publish to the Gitea OCI registry
      is the separate `gostream-image-build` job below (flux's
      `build-and-publish-image` base job). Needs a Linux node with Docker +
      buildx.
    run: playbooks/gostream-image-build.yaml
    timeout: 1800

# gostream-image-build — the REAL build+publish job named exactly per ROI /
# flux's cross-dep (`gostream:gostream-image-build`, referenced by flux's
# `phantom-library-bluegreen-repin-gitea-images`). Inherits flux's
# `build-and-publish-image` base job (spencerharmon/zuul-config, trusted
# config-project): buildah on the `buildah-pod` Nodepool node, login with the
# shared `gitea_registry_push` secret, `buildah bud` + `buildah push` to
# `git.spencerharmon.com/zuul/<image_name>:<tag>` (registry-served digest,
# never `:latest` — the base job's `image_tag` default is the git short sha).
# Untrusted project — this file MUST NOT define a `pipeline:` object, only
# attach to `post` (see header).
- job:
    name: gostream-image-build
    parent: build-and-publish-image
    description: >
      Builds repo/docker/Dockerfile and publishes
      git.spencerharmon.com/zuul/gostream:<tag> to the Gitea OCI registry via
      flux's build-and-publish-image base job. This IS the image supply for
      flux's phantom-library blue/green deploy — never an external/guessed
      ref, never :latest.
    vars:
      image_name: gostream
      image_context: .
      containerfile: docker/Dockerfile

# Attaches gostream's jobs to `post` — the only pipeline the flux `zuul`
# tenant config defines (check/gate were deleted tenant-wide; see header).
# gostream is an untrusted project here, so it can only attach jobs to
# pipelines the config-project already defines, never declare a new
# `pipeline:` object. `name:` is omitted so it defaults to this project as the
# git connection names it.
- project:
    post:
      jobs:
        - gostream-build-test
        - gostream-image-build-check
        - gostream-image-build
