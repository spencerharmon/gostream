# gostream image build + publish — self-hosted Gitea Actions
# =============================================================================
# Migrated off the retired self-hosted Zuul (see the removed repo/.zuul.yaml and
# repo/playbooks/*). Zuul is DEPRECATED and REMOVED from this environment; all CI
# now runs on the operator's self-hosted **Gitea Actions** runner (act_runner),
# in containers, with the workflow's own container images supplying the whole
# toolchain — nothing here depends on a tool pre-installed on the runner host.
#
# INFRASTRUCTURE-IDENTIFIER HYGIENE (this repo is a PUBLIC fork): NO real
# registry hostname is hardcoded here. The OCI registry host is injected at run
# time from the repo/org **Actions variable** `OCI_REGISTRY`, and push
# credentials from the **secrets** `OCI_REGISTRY_USERNAME` / `OCI_REGISTRY_TOKEN`.
# The image path segment `spencer/gostream` is a NAMESPACE only (renamed from the
# legacy `zuul` namespace, ROI reconcile 19ae9d1f, 2026-08-03 — Zuul itself is
# gone) — it is not an infrastructure identifier. Configure these on the Gitea
# repo (Settings -> Actions -> Variables/Secrets) so the workflow publishes to
# the private Gitea OCI registry without leaking its hostname into public source.
#
# Publishes BY DIGEST, pinned to the commit short-sha tag — NEVER `:latest`. The
# produced ref is the image supply flux's phantom-library blue/green deploy
# consumes (cross-dep `gostream:gostream-image-build`).

name: image-build

on:
  push:
    branches:
      - phantom-library/testing
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # build-test — gofmt / go vet / go build / go test. gostream links FUSE via
  # cgo (github.com/hanwen/go-fuse/v2), so every Go step runs CGO_ENABLED=1 and
  # the container installs libfuse3-dev + build-essential + pkg-config. This is
  # the exact verified sequence recorded in submodules/gostream/ARTIFACTS.md.
  # ---------------------------------------------------------------------------
  build-test:
    runs-on: ubuntu-latest
    container:
      image: golang:1.24-bookworm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cgo/FUSE build deps
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libfuse3-dev ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: gofmt (must report zero files)
        run: |
          set -eu
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt would reformat the following files:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: go vet ./...
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: go build ./...
        env:
          CGO_ENABLED: "1"
        run: go build ./...

      - name: go test ./...
        env:
          CGO_ENABLED: "1"
        run: go test -count=1 ./...

  # ---------------------------------------------------------------------------
  # image-publish — build repo/docker/Dockerfile with buildah (rootless, no
  # docker daemon) and push to the Gitea OCI registry BY DIGEST. Runs only after
  # build-test is green. buildah supplies its own toolchain from the
  # quay.io/buildah/stable image, so the runner host needs nothing preinstalled.
  # ---------------------------------------------------------------------------
  image-publish:
    needs: build-test
    runs-on: ubuntu-latest
    container:
      image: quay.io/buildah/stable:latest
      options: --privileged
    env:
      OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
      OCI_IMAGE: spencer/gostream
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight — registry configuration present
        run: |
          set -eu
          if [ -z "${OCI_REGISTRY:-}" ]; then
            echo "OCI_REGISTRY Actions variable is not set — configure it on the" >&2
            echo "Gitea repo (Settings -> Actions -> Variables) to the OCI registry host." >&2
            exit 1
          fi
          if [ -z "${OCI_REGISTRY_USERNAME:-}" ] || [ -z "${OCI_REGISTRY_TOKEN:-}" ]; then
            echo "OCI_REGISTRY_USERNAME / OCI_REGISTRY_TOKEN secrets are not set." >&2
            exit 1
          fi
        env:
          OCI_REGISTRY_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
          OCI_REGISTRY_TOKEN: ${{ secrets.OCI_REGISTRY_TOKEN }}

      - name: Compute image ref
        id: ref
        run: |
          set -eu
          tag="$(echo "${{ github.sha }}" | cut -c1-12)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "ref=${OCI_REGISTRY}/${OCI_IMAGE}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Registry login
        run: |
          set -eu
          buildah login \
            --username "${OCI_REGISTRY_USERNAME}" \
            --password-stdin \
            "${OCI_REGISTRY}" <<<"${OCI_REGISTRY_TOKEN}"
        env:
          OCI_REGISTRY_USERNAME: ${{ secrets.OCI_REGISTRY_USERNAME }}
          OCI_REGISTRY_TOKEN: ${{ secrets.OCI_REGISTRY_TOKEN }}

      - name: Build image
        run: |
          set -eux
          buildah bud \
            --file docker/Dockerfile \
            --build-arg APP_VERSION="${{ steps.ref.outputs.tag }}" \
            --tag "${{ steps.ref.outputs.ref }}" \
            .

      - name: Push image and capture digest
        id: push
        run: |
          set -eux
          buildah push \
            --digestfile /tmp/gostream.digest \
            "${{ steps.ref.outputs.ref }}" \
            "docker://${{ steps.ref.outputs.ref }}"
          digest="$(cat /tmp/gostream.digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Confirm pullable by digest
        run: |
          set -eux
          # Prove the pushed manifest is served from the registry BY DIGEST
          # (not merely that a tag was written) — never :latest.
          skopeo inspect --raw \
            "docker://${OCI_REGISTRY}/${OCI_IMAGE}@${{ steps.push.outputs.digest }}" \
            > /dev/null

      - name: Summary
        run: |
          {
            echo "## gostream image published"
            echo ""
            echo "- **ref:** \`${{ steps.ref.outputs.ref }}\`"
            echo "- **digest:** \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
