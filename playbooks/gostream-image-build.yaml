# gostream-image-build-check — builds the container image from
# docker/Dockerfile, proving it still builds on every change (a local, no-push
# sanity check). The REAL publish to the Gitea OCI registry is the separate
# `gostream-image-build` job (.zuul.yaml), which inherits flux's
# `build-and-publish-image` base job and needs no playbook of its own here —
# see docs/tasks/gostream-image-build.md. The build node must provide Docker +
# buildx.

# HONESTY GUARD (see gostream-build-test.yaml): fail loudly when flux's Nodepool
# assigned no build node, so a missing image-build node is an honest red rather
# than a play that matches zero hosts and reports green without building.
- hosts: localhost
  gather_facts: false
  tasks:
    - name: refuse to pass without a real build node
      ansible.builtin.fail:
        msg: >-
          gostream-image-build-check requires a Nodepool-provided build node
          with Docker + buildx. None was assigned. Failing honestly rather
          than skipping the image build and reporting green.
      when: groups['all'] | length == 0

- hosts: all
  tasks:
    - name: resolve the gostream checkout path
      ansible.builtin.set_fact:
        gostream_src: "{{ ansible_user_dir }}/{{ zuul.project.src_dir }}"

    - name: build the gostream container image for the node's native arch (no push)
      ansible.builtin.shell: |
        set -eu
        docker buildx build \
          --file docker/Dockerfile \
          --build-arg APP_VERSION=zuul-ci \
          --tag gostream:zuul-ci-check \
          --load \
          .
      args:
        chdir: "{{ gostream_src }}"
        executable: /bin/sh
