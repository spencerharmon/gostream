# OPTIONAL — SSD warm cache for gostream.
#
# Mounted at /usr/local/state/warmup (a subpath of the state root). Holds ONLY
# transient, reconstructible warm-cache data — NO permanent inode map. It is
# therefore WIPE-SAFE and deliberately does NOT carry the prune-disabled guard the
# state claim has: losing this cache costs a re-warm, never library integrity.
#
# Deploy only if a fast SSD warm cache is wanted. PER-COLOR, like the state claims
# (state-config-pvc-per-color): each color binds its OWN warmup claim
# (`gostream-warmup-<color>`) so no two pods write the cache concurrently. Losing
# this cache costs a re-warm, never library integrity. The reference Pod that binds
# it is owned by k8s-reference-manifests.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gostream-warmup-blue
  labels:
    app.kubernetes.io/name: gostream
    app.kubernetes.io/component: warmup-cache
    app.kubernetes.io/part-of: phantom-library
    gostream.dev/color: blue
spec:
  # RWO, single node (spray) — bound by only this color's pod. NOT ReadWriteOncePod
  # in case the pod is briefly recreated on the same node; never co-mounted by the
  # other color.
  accessModes:
    - ReadWriteOnce
  # Point at an SSD-backed StorageClass if one exists on spray; falls back to the
  # k3s built-in provisioner otherwise. Override in the flux overlay.
  storageClassName: local-path
  resources:
    requests:
      # Reference default for a warm cache; size to the working set. Reconstructible.
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gostream-warmup-green
  labels:
    app.kubernetes.io/name: gostream
    app.kubernetes.io/component: warmup-cache
    app.kubernetes.io/part-of: phantom-library
    gostream.dev/color: green
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
