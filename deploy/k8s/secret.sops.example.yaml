# gostream secret configuration — SCHEMA / EXAMPLE ONLY.
#
# ┌──────────────────────────────────────────────────────────────────────────┐
# │ THIS FILE IS COMMITTED SCHEMA-ONLY. IT CONTAINS ZERO PLAINTEXT TOKENS.     │
# │ Do NOT paste real tokens here and commit them. The real, populated Secret │
# │ is SOPS-encrypted and owned by flux in its own tree — never in this repo. │
# └──────────────────────────────────────────────────────────────────────────┘
#
# Purpose
#   Documents the exact shape of the gostream credential Secret so the flux
#   operator (and the k8s-reference-manifests capstone) knows which keys to
#   provide. The named tokens below are the ONLY secret keys in
#   repo/config.json.example:
#     - plex.token          (Plex auth token; nested under "plex")
#     - tmdb_api_key         (TMDB API key)
#     - library_api_token    (external library/add API token)
#   Everything else is non-secret tuning and lives in configmap.yaml.
#
# How it is consumed
#   The value of the single key `config.secret.json` is a JSON fragment holding
#   ONLY the secret keys, nested to mirror the app's config schema. At container
#   start the entrypoint deep-merges configmap's config.tuning.json with this
#   fragment (secret wins) into one /etc/gostream/config.json. Because the merge
#   is recursive, "plex": { "token": ... } here combines with
#   "plex": { "url", "library_id" } from the ConfigMap. See README.md.
#
# Producing the REAL encrypted Secret (done in flux's tree, NOT here)
#   1. Copy this schema, fill config.secret.json with real token values.
#   2. Encrypt the value(s) with SOPS, e.g.:
#        sops --encrypt --encrypted-regex '^(data|stringData)$' \
#             secret.plaintext.yaml > gostream-config-secret.sops.yaml
#   3. Commit ONLY the SOPS-encrypted output to flux; flux decrypts in-cluster.
#
apiVersion: v1
kind: Secret
metadata:
  name: gostream-config-secret
  namespace: gostream
  labels:
    app.kubernetes.io/name: gostream
    app.kubernetes.io/component: config
type: Opaque
stringData:
  # Schema-only: empty strings, no real tokens. Populate + SOPS-encrypt in flux.
  config.secret.json: |
    {
      "plex": {
        "token": ""
      },
      "tmdb_api_key": "",
      "library_api_token": ""
    }
